[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
authors = [
  {name = "Xuqian Yan", email = "xuqian.yan@siemens-energy.com"},

]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [  
  "matplotlib==3.9.2",
  "numpy>=2.0.1, <2.3.0",
  "pandas==2.2.3",          # pandas 2.2.3 is compatible with python 3.13
  "scikit-learn==1.6.1",    # scikit learn is compatible with python 3.13
  "scipy==1.15.1",          # Scipy 1.14.1 started to support py 3.13
  "pyarrow==19.0.0",
  "lmfit==1.3.2"
]

description = ""
name = "degradation_toolbox"
readme = "README.md"
requires-python = ">=3.12"
version = "2.0.1"

[tool.pytest.ini_options]


[tool.setuptools.packages.find]
exclude = ["build", "dist", "*.egg-info", "*.egg", "__pycache__"] 

[tool.setuptools.package-data]
degradation_toolbox = ["utils/*.parquet"]

[tool.vulture]
make_whitelist = true
min_confidence = 80
paths = ["degradation_toolbox"]
sort_by_size = true
