image: python:3.9-slim

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - test
  - build_package
  - build-sonar

default:
  before_script:
    # Following taken from https://siemens-energy.code.siemens-energy.io/code/faq/
    - export http_proxy="$CODE_PROXY"
    - export https_proxy="$CODE_PROXY"
    - export no_proxy="127.0.0.1,localhost,.siemens-energy.de,.siemens-energy.net,.siemens-energy.com,.siemens-energy.io,s3.eu-central-1.amazonaws.com"
    - export HTTP_PROXY="$http_proxy"
    - export HTTPS_PROXY="$http_proxy"
    - export NO_PROXY="$no_proxy"

package_urc:
  stage: build_package
  only:
    refs:
      - main
    changes:
      # Only run pipeline if version number in pyproject.toml is updated
      - pyproject.toml

  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

test:
  stage: test
  image: python:3.12
  script:
  - pip install -r degradation_toolbox/requirements.txt
  - pytest --cov-report term --cov=degradation_toolbox --cov-report xml
  artifacts:
    paths:
    - coverage.xml
  coverage: /TOTAL.*\s+(\d+%)$/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

build-sonar:
  image: 
      name: sonarsource/sonar-scanner-cli:11
      entrypoint: [""]
  stage: build-sonar
  dependencies:
  - test
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script: 
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.language=py -Dsonar.python.coverage.reportPaths=coverage.xml
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'